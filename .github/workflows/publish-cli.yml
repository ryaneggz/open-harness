name: Publish CLI to npm

# Publishes the standalone CLI (`.agro/cli`) to npm as @mifune/agro, then the
# @mifune/openharness compatibility shim (`.agro/cli/legacy`) that depends on the
# exact @mifune/agro version, and deprecates the shim toward @mifune/agro.
#
# The CLI's version is independent of the harness release tags. This
# reusable workflow is called by release.yml after image publication, and can
# also be dispatched for a CLI-only change. Both callers must identify the exact
# commit to publish; each version guard makes an existing version a successful
# no-op.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or ref containing the CLI package to publish
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit or ref containing the CLI package to publish
        required: true
        type: string

jobs:
  publish-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - name: Checkout the requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Skip @mifune/agro if the version is already published
        id: guard
        run: |
          V=$(node -p "require('./.agro/cli/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if npm view "@mifune/agro@$V" version --prefer-online >/dev/null 2>&1; then
            echo "@mifune/agro@$V already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "@mifune/agro@$V not yet published — will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CLI dev dependencies
        if: steps.guard.outputs.skip == 'false'
        working-directory: .agro/cli
        run: npm ci --ignore-scripts

      - name: Build CLI bundle
        if: steps.guard.outputs.skip == 'false'
        working-directory: .agro/cli
        run: npm run build

      - name: Publish @mifune/agro to npm
        if: steps.guard.outputs.skip == 'false'
        working-directory: .agro/cli
        # `npm publish` packs the working directory and ignores `--prefix` for
        # package selection — running from repo root would pack the private
        # root package (EPRIVATE). Must run inside .agro/cli.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip @mifune/openharness if the version is already published
        id: legacy_guard
        env:
          V: ${{ steps.guard.outputs.version }}
        run: |
          LEGACY_V=$(node -p "require('./.agro/cli/legacy/package.json').version")
          PIN=$(node -p "require('./.agro/cli/legacy/package.json').dependencies['@mifune/agro']")
          if [ "$LEGACY_V" != "$V" ] || [ "$PIN" != "$V" ]; then
            echo "@mifune/openharness@$LEGACY_V pins @mifune/agro@$PIN — both must equal @mifune/agro@$V" >&2
            exit 1
          fi
          if npm view "@mifune/openharness@$V" version --prefer-online >/dev/null 2>&1; then
            echo "@mifune/openharness@$V already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "@mifune/openharness@$V not yet published — will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for @mifune/agro to resolve on the registry
        if: steps.legacy_guard.outputs.skip == 'false'
        env:
          V: ${{ steps.guard.outputs.version }}
        run: .agro/scripts/npm-wait-version.sh "@mifune/agro" "$V"

      - name: Publish @mifune/openharness to npm
        if: steps.legacy_guard.outputs.skip == 'false'
        working-directory: .agro/cli/legacy
        # Same EPRIVATE rule as above: the shim must be packed from its own directory.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecate @mifune/openharness toward @mifune/agro
        if: steps.legacy_guard.outputs.skip == 'false'
        env:
          V: ${{ steps.guard.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          .agro/scripts/npm-wait-version.sh "@mifune/openharness" "$V"
          npm deprecate "@mifune/openharness@$V" "@mifune/openharness is the compatibility entry point for AGRO; install @mifune/agro (agro) — oh keeps working through the compatibility window"
          DEPRECATED=$(npm view "@mifune/openharness@$V" deprecated --prefer-online --cache "$(mktemp -d)")
          if [ -z "$DEPRECATED" ]; then
            echo "@mifune/openharness@$V carries no deprecation notice after npm deprecate" >&2
            exit 1
          fi
          echo "@mifune/openharness@$V is deprecated: $DEPRECATED"
